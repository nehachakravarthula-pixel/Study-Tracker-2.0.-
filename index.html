<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#f6f4ee" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title>Study Command Centre</title>

<style>
:root{
  --bg:#f6f4ee;
  --panel:#fffdf9;
  --ink:#101a2e;
  --muted:#6f7787;
  --line:#dde1e8;
  --navy:#0d1730;
  --navy2:#172647;
  --accent:#243b69;
  --pink:#c73578;
  --pink-soft:#f7e7ef;
  --soft:#eef1f6;
  --danger:#9a3b3b;
  --good:#47765c;
  --shadow:0 8px 25px rgba(16,26,46,.05);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.5;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}

.app{min-height:100vh;display:block}

/* TOP NAV */
.sidebar{display:none}
.topnav{
  position:sticky;top:0;z-index:20;background:rgba(246,244,238,.94);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
}
.topnav-inner{
  max-width:1420px;margin:auto;height:72px;padding:0 26px;
  display:flex;align-items:center;gap:28px;
}
.brand{font-weight:850;font-size:18px;letter-spacing:-.025em;white-space:nowrap}
.brand span{display:block;color:var(--muted);font-size:11px;font-weight:550;margin-top:1px}
.toplinks{display:flex;align-items:center;gap:3px;overflow:auto;flex:1}
.toplinks button{
  border:0;background:transparent;color:var(--muted);font-weight:700;
  font-size:10px;padding:9px 11px;border-radius:9px;white-space:nowrap;text-transform:uppercase;letter-spacing:.08em;
}
.toplinks button:hover,.toplinks button.active{background:transparent;color:var(--ink);position:relative}.toplinks button.active:after{content:"";position:absolute;left:11px;right:11px;bottom:2px;height:2px;background:var(--pink);border-radius:2px}
.hamburger{
  border:1px solid var(--line);background:var(--panel);color:var(--ink);
  width:42px;height:42px;border-radius:11px;font-size:20px;display:grid;place-items:center;
}
.mobile-nav{display:none}

/* RIGHT DRAWER */
.drawer-backdrop{position:fixed;inset:0;background:rgba(5,10,20,.22);display:none;z-index:29}
.drawer-backdrop.show{display:block}
.drawer{
  position:fixed;right:-350px;top:0;bottom:0;width:min(350px,90vw);background:var(--panel);
  z-index:30;box-shadow:-18px 0 40px rgba(0,0,0,.13);padding:24px 18px;
  transition:right .22s ease;overflow-y:auto;
}
.drawer.show{right:0}
.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.drawer-head h3{margin:0;font-size:18px}
.drawer-close{border:0;background:var(--soft);border-radius:10px;width:36px;height:36px}
.drawer-section{padding:14px 0;border-bottom:1px solid var(--line)}
.drawer-section:last-child{border-bottom:0}
.drawer-label{text-transform:uppercase;letter-spacing:.12em;font-size:10px;font-weight:800;color:var(--muted);margin-bottom:7px}
.drawer-link{
  width:100%;border:0;background:transparent;text-align:left;padding:10px 10px;border-radius:9px;
  color:var(--ink);font-weight:700;
}
.drawer-link:hover{background:var(--soft)}

.main{max-width:1420px;margin:0 auto;padding:34px 26px 70px;width:100%}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:28px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:var(--muted);font-weight:800}
h1{margin:4px 0;font-size:35px;line-height:1.1;letter-spacing:-.035em}
.subtitle{color:var(--muted);max-width:700px}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{
  border:1px solid var(--line);background:var(--panel);color:var(--ink);
  padding:9px 13px;border-radius:10px;font-weight:700;
}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pink{background:var(--pink);border-color:var(--pink);color:#fff}

.grid{display:grid;gap:18px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:15px;
  box-shadow:var(--shadow);padding:20px;
}
.section{margin-top:18px}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.section-title h2{margin:0;font-size:19px;letter-spacing:-.02em}
.section-caption{font-size:12px;color:var(--muted)}
.kpi-label{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.10em}
.kpi{font-size:28px;font-weight:850;margin:6px 0 1px}
.kpi-note{font-size:12px;color:var(--muted)}
.cols-2{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr)}
.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.progress{height:8px;background:#e9ebef;border-radius:999px;overflow:hidden}
.progress>span{display:block;height:100%;background:var(--accent);border-radius:999px}
.progress.pink>span{background:var(--pink)}

.list{display:grid;gap:9px}
.task,.goal,.exam,.topic{
  border:1px solid var(--line);border-radius:11px;padding:13px;background:#fff;
}
.task{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:11px}
.check{width:19px;height:19px;border:1px solid #b9bec9;border-radius:6px;background:white;display:grid;place-items:center}
.task.done{opacity:.55}
.task.done .task-name{text-decoration:line-through}.task-done{text-decoration:line-through;color:var(--muted)}
.task-name{font-weight:750}
.meta{font-size:12px;color:var(--muted)}
.badge{
  display:inline-flex;align-items:center;gap:5px;font-size:10px;border-radius:999px;
  padding:5px 8px;background:var(--soft);color:var(--accent);font-weight:800;white-space:nowrap;
}
.badge.high{background:#f8e7e7;color:#8f3030}
.badge.medium{background:#f5efdf;color:#7a632a}
.badge.pink{background:var(--pink-soft);color:var(--pink)}
.item-actions{display:flex;gap:2px;align-items:center}
.small-btn{border:0;background:transparent;color:var(--muted);padding:4px 5px;border-radius:6px}
.small-btn:hover{background:var(--soft);color:var(--ink)}
.empty{color:var(--muted);font-size:13px;padding:8px 0}
.notice{
  background:var(--soft);border:1px solid #dde2eb;padding:11px 13px;border-radius:10px;
  font-size:13px;color:#4a5870;
}
.page{display:none}.page.active{display:block}


/* REFINED EDITORIAL DASHBOARD */
.dashboard-page{max-width:1280px;margin:0 auto}
.editorial-hero{
  position:relative;min-height:270px;border-radius:0 0 18px 18px;overflow:hidden;
  background:#f6f4ee;
  display:flex;align-items:flex-end;margin:0 -10px 30px;box-shadow:var(--shadow);
}
.editorial-hero:before{content:"";position:absolute;width:430px;height:430px;right:-120px;top:-180px;border:1px solid rgba(13,23,48,.10);border-radius:50%;}.editorial-hero:after{content:"";position:absolute;width:260px;height:260px;right:40px;bottom:-170px;border:1px solid rgba(199,53,120,.18);border-radius:50%;}
.hero-content{position:relative;z-index:1;padding:32px 38px;width:100%;display:flex;justify-content:space-between;align-items:flex-end;gap:28px}
.hero-kicker{font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:850;color:var(--pink)}
.hero-title{font-size:47px;line-height:1;letter-spacing:-.045em;margin:7px 0 9px;max-width:620px}
.hero-sub{max-width:610px;color:#475266;font-size:14px}
.hero-stats{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}
.hero-stat{min-width:105px;background:rgba(255,253,249,.88);backdrop-filter:blur(9px);border:1px solid rgba(255,255,255,.62);padding:11px 13px;border-radius:10px}
.hero-stat b{display:block;font-size:20px;letter-spacing:-.03em}.hero-stat span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:800;margin-top:2px}
.editorial-section{margin-top:26px}
.editorial-section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:12px}
.editorial-section-head h2{font-size:22px;letter-spacing:-.03em;margin:0}.editorial-section-head p{margin:3px 0 0;color:var(--muted);font-size:12px}
.editorial-layout{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(310px,.82fr);gap:18px}
.clean-list{display:grid;gap:0}
.clean-item{display:grid;grid-template-columns:24px 1fr auto;gap:13px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}
.clean-item:first-child{padding-top:4px}.clean-item:last-child{border-bottom:0;padding-bottom:4px}
.clean-index{font-size:11px;color:var(--pink);font-weight:850;letter-spacing:.05em}
.clean-item-title{font-weight:780}.clean-item-meta{color:var(--muted);font-size:11px;margin-top:2px}
.focus-panel{background:var(--navy);color:white;border-radius:14px;padding:22px;min-height:100%;position:relative;overflow:hidden}
.focus-panel:after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;right:-75px;top:-90px;border:1px solid rgba(255,255,255,.10)}
.focus-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#b9c4d9;font-weight:800}.focus-title{font-size:28px;line-height:1.08;letter-spacing:-.035em;margin:7px 0 11px;max-width:300px}.focus-copy{font-size:12px;color:#c7cedc;max-width:310px}
.focus-rule{height:1px;background:rgba(255,255,255,.13);margin:18px 0}.focus-metric{display:flex;justify-content:space-between;gap:20px;margin:9px 0;font-size:12px}.focus-metric b{color:white}
.reading-card{padding:20px 0}.reading-head{display:flex;align-items:baseline;gap:8px}.reading-head .big{font-size:40px;font-weight:850;letter-spacing:-.04em}.reading-head .unit{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:800}.thin-progress{height:5px;background:#e7e9ed;border-radius:999px;overflow:hidden;margin:10px 0 6px}.thin-progress span{display:block;height:100%;background:var(--pink)}
.dashboard-grid-wide{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.editorial-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:19px;box-shadow:var(--shadow)}
.editorial-card h3{margin:0;font-size:15px;letter-spacing:-.01em}.editorial-card .caption{font-size:11px;color:var(--muted);margin-top:3px}.editorial-value{font-size:30px;font-weight:850;letter-spacing:-.035em;margin-top:14px}.editorial-foot{font-size:11px;color:var(--muted);margin-top:3px}
.upcoming-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.upcoming-row:last-child{border-bottom:0}.date-block{text-align:right}.date-block b{display:block;font-size:13px}.date-block span{font-size:10px;color:var(--muted)}
@media(max-width:900px){.editorial-layout,.dashboard-grid-wide{grid-template-columns:1fr}.hero-content{align-items:flex-start;flex-direction:column}.hero-stats{justify-content:flex-start}.hero-title{font-size:39px}}
@media(max-width:700px){.editorial-hero{min-height:330px;margin:0 0 24px}.hero-content{padding:25px 22px}.hero-title{font-size:34px}.hero-stats{width:100%}.hero-stat{flex:1;min-width:92px}.dashboard-page{max-width:none}.editorial-section-head{display:block}.editorial-section-head .btn{margin-top:10px}}

/* More readable tables */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:620px}
th,td{padding:12px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
tbody tr:hover{background:#faf9f5}

/* Charts */
.chart{height:205px;display:flex;align-items:end;gap:10px;padding-top:12px}
.bar-wrap{flex:1;height:100%;display:flex;flex-direction:column;justify-content:end;gap:6px;align-items:center;min-width:14px}
.bar{width:100%;max-width:34px;background:var(--accent);border-radius:7px 7px 2px 2px;min-height:2px}
.bar-label{font-size:10px;color:var(--muted)}

/* Timer */
.timer{display:grid;gap:16px;place-items:center;padding:25px 10px}
.clock{font-size:72px;font-variant-numeric:tabular-nums;letter-spacing:-.05em;font-weight:800}
.timer-controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.timer-expand{width:100%;display:flex;justify-content:flex-end}.focus-overlay{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;overflow:auto}.focus-overlay.show{display:block}.focus-shell{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(330px,.85fr);gap:0}.focus-main{padding:34px 5vw;display:flex;flex-direction:column;justify-content:center;align-items:center;border-right:1px solid var(--line)}.focus-side{padding:34px;overflow:auto}.focus-kicker{text-transform:uppercase;letter-spacing:.15em;font-size:11px;font-weight:800;color:var(--muted)}.focus-clock{font-size:clamp(90px,13vw,180px);font-weight:850;letter-spacing:-.07em;font-variant-numeric:tabular-nums;line-height:1;margin:22px 0}.focus-selects{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.focus-selects select,.focus-selects input{border:1px solid var(--line);background:#fff;padding:10px 12px;border-radius:10px}.focus-title{font-size:24px;font-weight:850;margin:0}.focus-side-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}.focus-task{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:start;padding:13px 0;border-bottom:1px solid var(--line)}.focus-task.done{opacity:.55}.focus-task.done .focus-task-name{text-decoration:line-through}.focus-task input{margin-top:4px}.focus-task-name{font-weight:750}.focus-task-meta{font-size:11px;color:var(--muted);margin-top:3px}/* Compact subject-wise topic dropdowns */
.topic-directory{display:grid;gap:12px}
.subject-dropdown{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
.subject-dropdown[open]{box-shadow:0 8px 24px rgba(10,20,40,.05)}
.subject-dropdown summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:17px 18px}
.subject-dropdown summary::-webkit-details-marker{display:none}
.subject-drop-left{display:flex;align-items:center;gap:12px;min-width:0}
.subject-drop-left b{font-size:16px}
.subject-drop-right{display:flex;align-items:center;gap:12px;min-width:170px;justify-content:flex-end;font-weight:800;font-size:13px}
.chevron{width:25px;height:25px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:19px;line-height:1;transition:transform .18s}
.subject-dropdown[open] .chevron{transform:rotate(90deg)}
.mini-progress{width:90px;height:5px;background:#eef0f4;border-radius:99px;overflow:hidden}
.mini-progress i{display:block;height:100%;background:var(--ink);border-radius:99px}
.subject-topic-list{border-top:1px solid var(--line);padding:5px 18px 12px}
.subject-topic-list .topic-progress-card{padding:13px 0;border-bottom:1px solid #eef0f4}
.subject-topic-list .topic-progress-card:last-child{border-bottom:0}
.topic-progress-card{display:grid;gap:10px}.topic-progress-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.topic-subject{font-size:10px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);font-weight:800}.topic-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted)}.topic-actions{display:flex;gap:6px;justify-content:flex-end}.topic-group{display:grid;gap:10px;margin-bottom:22px}.topic-group h3{font-size:12px;text-transform:uppercase;letter-spacing:.12em;margin:0;color:var(--muted)}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.detail-stat{border:1px solid var(--line);border-radius:11px;padding:13px;background:#fff}.detail-stat b{display:block;font-size:20px}.focus-close{position:absolute;right:24px;top:20px;z-index:2}@media(max-width:800px){.focus-shell{grid-template-columns:1fr}.focus-main{border-right:0;border-bottom:1px solid var(--line);min-height:62vh;padding:70px 20px 30px}.focus-side{padding:24px 20px}.focus-close{right:16px;top:14px}}

/* Forms */
.form-inline{display:flex;gap:8px;flex-wrap:wrap}
.form-inline input,.form-inline select{
  border:1px solid var(--line);border-radius:10px;padding:9px;background:white
}
.modal-backdrop{position:fixed;inset:0;background:rgba(5,10,20,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:40}
.modal-backdrop.show{display:flex}
.modal{width:min(670px,100%);background:var(--panel);border-radius:16px;padding:20px;box-shadow:0 25px 60px rgba(0,0,0,.2);max-height:90vh;overflow:auto}
.modal h3{margin:0 0 15px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:grid;gap:6px}.field.full{grid-column:1/-1}
.field label{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:white;border-radius:10px;padding:10px}
.field textarea{min-height:90px;resize:vertical}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

/* Calendar */
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.cal-head{font-size:10px;color:var(--muted);font-weight:800;text-align:center;padding:6px}
.day{min-height:102px;background:white;border:1px solid var(--line);border-radius:10px;padding:8px}
.day.muted{background:transparent;opacity:.45}
.day-num{font-size:12px;font-weight:800}
.dot-row{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.day .dot:nth-child(3){background:var(--pink)}

/* Cleaner vertical rhythm */
#pages .page > .card,
#pages .page > .grid{margin-top:18px}
#pages .page > .topbar + .grid,
#pages .page > .topbar + .card{margin-top:0}
.card + .card{margin-top:18px}

/* Responsive */
@media(max-width:1100px){
  .toplinks button:nth-child(n+7){display:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols-2,.cols-3{grid-template-columns:1fr}
}
@media(max-width:760px){
  .topnav-inner{height:64px;padding:0 14px;gap:13px}
  .brand{font-size:16px}.brand span{font-size:10px}
  .toplinks{display:none}
  .main{padding:24px 14px 55px}
  .topbar{display:block;margin-bottom:22px}
  .actions{justify-content:flex-start;margin-top:14px}
  h1{font-size:28px}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .card{padding:16px}
  .task{grid-template-columns:auto 1fr;}.task .item-actions{grid-column:2}
  .form-grid{grid-template-columns:1fr}
  .field.full{grid-column:auto}
  .clock{font-size:55px}
  .calendar{gap:4px}
  .day{min-height:75px;padding:6px}
  .day .meta{font-size:9px}
}

/* iPad / touch optimisation */
html,body{width:100%;min-height:100%;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{overscroll-behavior-y:none}
button,select,input{min-height:44px}
.btn,.small-btn,.check,.drawer-link,.toplinks button{touch-action:manipulation}
input,select,textarea{font-size:16px} /* prevents Safari zoom on form focus */
@supports(padding:max(0px)){
 .topnav{padding-top:env(safe-area-inset-top)}
 .main{padding-bottom:max(28px,env(safe-area-inset-bottom))}
}
@media (max-width:900px){
 .topnav-inner{padding-left:16px;padding-right:16px}
 .toplinks{display:none}
 .hamburger{display:block}
 .main{padding:24px 18px 40px}
 .topbar{align-items:flex-start;gap:12px}
 .topbar .actions{flex-wrap:wrap}
 table{min-width:560px}
 .modal{width:min(680px,calc(100vw - 28px));max-height:88vh;overflow:auto;-webkit-overflow-scrolling:touch}
}
@media (max-width:700px){
 .hero-title{font-size:36px}
 .grid.cols-2,.grid.cols-3,.editorial-layout,.dashboard-grid-wide{grid-template-columns:1fr}
 .form-grid{grid-template-columns:1fr}
 .subject-drop-right{min-width:auto}
 .subject-drop-right .mini-progress{display:none}
 .topic-meta{flex-wrap:wrap}
 .topic-actions{flex-wrap:wrap}
}
/* Full-screen focus mode */
.focus-overlay{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;overflow:auto;-webkit-overflow-scrolling:touch}
.focus-overlay.show{display:block}
.focus-shell{min-height:100dvh;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,.7fr);gap:0}
.focus-main{background:var(--navy);color:#fff;min-height:100dvh;padding:clamp(28px,5vw,70px);display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.focus-main:before{content:"";position:absolute;width:440px;height:440px;border:1px solid rgba(255,255,255,.08);border-radius:50%;right:-170px;top:-150px}
.focus-main:after{content:"";position:absolute;width:260px;height:260px;border:1px solid rgba(255,255,255,.06);border-radius:50%;left:-150px;bottom:-100px}
.focus-close{position:absolute;right:22px;top:18px;z-index:2;border:1px solid rgba(255,255,255,.2);background:transparent;color:#fff;border-radius:10px;padding:9px 13px;min-height:44px}
.focus-kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#aeb9ce;font-weight:800;position:relative;z-index:1}
.focus-context{font-size:18px;font-weight:700;margin-top:10px;position:relative;z-index:1;max-width:650px}
.focus-clock{font-size:clamp(76px,13vw,150px);font-weight:850;letter-spacing:-.07em;line-height:.95;margin:28px 0;position:relative;z-index:1;font-variant-numeric:tabular-nums}
.focus-controls{display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.focus-controls .btn{min-width:110px}
.focus-side{background:var(--panel);padding:clamp(22px,4vw,42px);border-left:1px solid var(--line);min-height:100dvh}
.focus-side h2{margin:0;font-size:22px;letter-spacing:-.03em}
.focus-side .caption{color:var(--muted);font-size:12px;margin:4px 0 20px}
.focus-fields{display:grid;gap:10px;margin-bottom:22px}
.focus-field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:var(--muted);margin-bottom:5px}
.focus-field select,.focus-field input{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;min-height:46px}
.focus-task-list{display:grid;gap:9px}
.focus-task{display:grid;grid-template-columns:28px 1fr auto;gap:9px;align-items:start;padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff}
.focus-task input{width:22px;height:22px;margin:1px 0}
.focus-task-name{font-size:13px;font-weight:750}
.focus-task-meta{font-size:10px;color:var(--muted);margin-top:2px}
.focus-task.done .focus-task-name{text-decoration:line-through;color:var(--muted)}
.focus-note{margin-top:18px;padding:12px;border-radius:10px;background:var(--soft);font-size:11px;color:var(--muted)}
@media(max-width:850px){
 .focus-shell{grid-template-columns:1fr}
 .focus-main{min-height:auto;height:auto;padding:78px 24px 30px}
 .focus-clock{font-size:clamp(68px,18vw,105px);margin:24px 0}
 .focus-side{min-height:auto;border-left:0;border-top:1px solid var(--line);padding:24px}
 .focus-close{top:12px;right:14px}
}
@media(orientation:landscape) and (max-height:600px){
 .focus-shell{grid-template-columns:1.2fr .8fr}
 .focus-main{padding:55px 30px 25px}
 .focus-clock{font-size:70px;margin:12px 0 20px}
 .focus-side{padding:20px}
}

</style>

</head>
<body>
<div class="app">
  <header class="topnav">
    <div class="topnav-inner">
      <div class="brand">Study Command Centre<span>Plan. Study. Progress.</span></div>
      <nav class="toplinks" id="toplinks"></nav>
      <button class="hamburger" onclick="toggleDrawer()" aria-label="Open navigation">☰</button>
    </div>
  </header>

  <aside class="drawer" id="drawer">
    <div class="drawer-head"><h3>Navigate</h3><button class="drawer-close" onclick="toggleDrawer()">×</button></div>
    <div class="drawer-section"><div class="drawer-label">Main</div>
      <button class="drawer-link" onclick="go('dashboard');toggleDrawer()">Dashboard</button>
      <button class="drawer-link" onclick="go('today');toggleDrawer()">Today</button>
    </div>
    <div class="drawer-section"><div class="drawer-label">Study</div>
      <button class="drawer-link" onclick="go('study');toggleDrawer()">Subjects & Study</button>
      <button class="drawer-link" onclick="go('questions');toggleDrawer()">Question Bank</button>
      <button class="drawer-link" onclick="go('revision');toggleDrawer()">Revision</button>
    </div>
    <div class="drawer-section"><div class="drawer-label">Planning</div>
      <button class="drawer-link" onclick="go('goals');toggleDrawer()">Goals</button>
      <button class="drawer-link" onclick="go('exams');toggleDrawer()">Exams</button>
      <button class="drawer-link" onclick="go('calendar');toggleDrawer()">Calendar</button>
    </div>
    <div class="drawer-section"><div class="drawer-label">Review</div>
      <button class="drawer-link" onclick="go('analytics');toggleDrawer()">Analytics</button>
    </div>
  </aside>
  <div class="drawer-backdrop" id="drawerBackdrop" onclick="toggleDrawer()"></div>

  <main class="main">
    <div id="pages"></div>
  </main>
</div>
<div class="focus-overlay" id="focusOverlay" aria-label="Focus timer">
  <div class="focus-shell">
    <section class="focus-main">
      <button class="focus-close" onclick="collapseTimer()">← Back</button>
      <div class="focus-kicker">Focus session</div>
      <div class="focus-context" id="focusLabel">Choose a subject and topic</div>
      <div class="focus-clock" id="focusClock">25:00</div>
      <div class="focus-controls">
        <button class="btn primary" onclick="startTimer()">Start</button>
        <button class="btn" onclick="pauseTimer()">Pause</button>
        <button class="btn" onclick="resetTimer()">Reset</button>
      </div>
    </section>
    <aside class="focus-side">
      <h2>What to do</h2>
      <div class="caption">Your tasks for this study period</div>
      <div class="focus-fields">
        <div class="focus-field"><label>Subject</label><select id="focusSubject"><option value="">Subject</option></select></div>
        <div class="focus-field"><label>Topic</label><select id="focusTopic"><option value="">Topic</option></select></div>
        <div class="focus-field"><label>Duration (minutes)</label><input id="focusMins" type="number" min="1" value="25" inputmode="numeric"></div>
      </div>
      <div id="focusTasks" class="focus-task-list"></div>
      <div class="focus-note">Tick tasks off as you finish them. When the timer reaches zero, the study time is saved automatically.</div>
    </aside>
  </div>
</div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div>

<script>
const KEY='studyCommandCentre_v1';
const defaultData={
 tasks:[], subjects:[], topics:[], sessions:[], questions:[], revisions:[], goals:[], exams:[], settings:{}
};
let data=load();
function load(){
 try{let raw=localStorage.getItem(KEY);return {...defaultData,...(raw?JSON.parse(raw):{})}}
 catch(e){try{let raw=sessionStorage.getItem(KEY);return {...defaultData,...(raw?JSON.parse(raw):{})}}catch(_){return {...defaultData}}}
}
function save(){
 let payload=JSON.stringify(data);
 try{localStorage.setItem(KEY,payload)}catch(e){try{sessionStorage.setItem(KEY,payload)}catch(_){} }
 renderAll();
 setTimeout(()=>{ if(document.getElementById('timerSubject')) syncStudyTopicSelect(); },0);
}
function uid(){return Math.random().toString(36).slice(2,10)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function today(){return new Date().toISOString().slice(0,10)}
function fmtDate(d){if(!d)return '—';let x=new Date(d+'T00:00:00');return x.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}
function daysBetween(a,b){return Math.ceil((new Date(b)-new Date(a))/86400000)}
function pct(a,b){return b?Math.round(a/b*100):0}
function durMin(s){return Number(s.duration||0)}
function totalStudy(){return data.sessions.reduce((a,s)=>a+durMin(s),0)}
function dateStudy(day){return data.sessions.filter(s=>s.date===day).reduce((a,s)=>a+durMin(s),0)}
function sumQuestion(){return data.questions.reduce((a,q)=>a+Number(q.total||0),0)}
function doneQuestion(){return data.questions.reduce((a,q)=>a+Number(q.completed||0),0)}
function pageName(){return location.hash.replace('#/','')||'dashboard'}
const pages=['dashboard','today','study','topics','questions','revision','goals','exams','analytics','calendar'];
const labels={dashboard:'Dashboard',today:'Today',study:'Study',topics:'Topics',questions:'Question Bank',revision:'Revision',goals:'Goals',exams:'Exams',analytics:'Analytics',calendar:'Calendar'};
const icons={dashboard:'⌂',today:'✓',study:'▤',topics:'◈',questions:'□',revision:'↻',goals:'◎',exams:'◫',analytics:'◌',calendar:'▦'};

function toggleDrawer(){
 const d=document.getElementById('drawer'), b=document.getElementById('drawerBackdrop');
 d.classList.toggle('show'); b.classList.toggle('show');
}
function navHTML(){
 const top=['dashboard','today','study','topics','questions','revision','goals','exams','analytics'];
 document.getElementById('toplinks').innerHTML=top.map(p=>`<button class="${pageName()===p?'active':''}" onclick="go('${p}')">${labels[p]}</button>`).join('');


}
function go(p){location.hash='#/'+p}
window.addEventListener('hashchange',renderAll);

function shell(title,sub,actions=''){
 return `<div class="topbar"><div><div class="eyebrow">${new Date().toLocaleDateString('en-IN',{weekday:'long',month:'long',day:'numeric'})}</div><h1>${title}</h1><div class="subtitle">${sub}</div></div><div class="actions">${actions}</div></div>`;
}
function btn(text,fn,primary=false){return `<button class="btn ${primary?'primary':''}" onclick="${fn}">${text}</button>`}

function dashboard(){
 const tTasks=data.tasks.filter(t=>t.date===today()).sort((a,b)=>rank(b)-rank(a));
 const incomplete=tTasks.filter(t=>!t.done);
 const completed=tTasks.filter(t=>t.done).length;
 const actual=dateStudy(today());
 const planned=tTasks.reduce((a,t)=>a+Number(t.minutes||0),0);
 const qTotal=sumQuestion(), qDone=doneQuestion();
 const due=data.revisions.filter(r=>r.nextDate && r.nextDate<=today()).sort((a,b)=>(a.nextDate||'').localeCompare(b.nextDate||'')).slice(0,4);
 const upcoming=data.exams.filter(e=>daysBetween(today(),e.date)>=0).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4);
 const nextTask=incomplete[0];
 const goal=data.goals.filter(g=>g.status!=='Completed').sort((a,b)=>(+b.progress||0)-(+a.progress||0))[0];
 const lastSession=data.sessions.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];
 const daysLeft=upcoming.length?daysBetween(today(),upcoming[0].date):null;
 const taskPct=tTasks.length?Math.round(completed/tTasks.length*100):0;

 let content=`<div class="dashboard-page">`;
 content+=`<div class="editorial-hero">
   <div class="hero-content">
     <div>
       <div class="hero-kicker">Your study space · ${new Date().toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</div>
       <div class="hero-title">Make today<br>count.</div>
       <div class="hero-sub">A calmer dashboard for the work that actually matters — study, questions, deadlines and the next step toward your bigger goals.</div>
     </div>
     <div class="hero-stats">
       <div class="hero-stat"><b>${taskPct}%</b><span>today done</span></div>
       <div class="hero-stat"><b>${Math.floor(actual/60)}h ${actual%60}m</b><span>study logged</span></div>
       <div class="hero-stat"><b>${qDone}</b><span>questions done</span></div>
     </div>
   </div>
 </div>`;

 content+=`<div class="editorial-section"><div class="editorial-section-head"><div><h2>Today, in motion</h2><p>The few things worth seeing the moment you open the app.</p></div>${btn('+ Add task',"openTask()",true)}</div>
 <div class="editorial-layout">
   <div class="editorial-card"><div class="clean-list">${
     tTasks.length ? tTasks.slice(0,6).map((t,i)=>`<div class="clean-item">
       <div class="clean-index">${String(i+1).padStart(2,'0')}</div>
       <div><div class="clean-item-title ${t.done?'task-done':''}">${esc(t.name)}</div><div class="clean-item-meta">${esc(t.subject||'General')} · ${t.minutes||0} min${t.deadline?' · '+esc(t.deadline):''}</div></div>
       <div class="item-actions"><span class="badge ${t.priority?.toLowerCase()||''}">${esc(t.priority||'Low')}</span><button class="small-btn" onclick="toggleTask('${t.id}')">${t.done?'↶':'✓'}</button></div>
     </div>`).join('') : `<div class="empty" style="padding:18px 0">Your day is clear. Add the first task you want to move forward.</div>`
   }</div>
   <div class="notice" style="margin-top:14px">Planned <b>${Math.floor(planned/60)}h ${planned%60}m</b> · Logged <b>${Math.floor(actual/60)}h ${actual%60}m</b> · ${incomplete.length} task${incomplete.length===1?'':'s'} left</div>
   </div>
   <div class="focus-panel">
     <div class="focus-label">Focus next</div>
     <div class="focus-title">${esc(nextTask?.name||'Choose one meaningful task.')}</div>
     <div class="focus-copy">${nextTask?`${esc(nextTask.subject||'General')} · ${nextTask.minutes||0} minutes · ${esc(nextTask.priority||'Low')} priority`:'Your highest-priority unfinished task will appear here.'}</div>
     <div class="focus-rule"></div>
     <div class="focus-metric"><span>Task completion</span><b>${taskPct}%</b></div>
     <div class="focus-metric"><span>Study today</span><b>${Math.floor(actual/60)}h ${actual%60}m</b></div>
     <div class="focus-metric"><span>Next exam</span><b>${daysLeft===null?'—':daysLeft===0?'Today':daysLeft+' days'}</b></div>
     ${nextTask?`<button class="btn" style="margin-top:16px;background:white;color:var(--navy);border-color:white" onclick="toggleTask('${nextTask.id}')">Mark complete</button>`:''}
   </div>
 </div></div>`;

 content+=`<div class="editorial-section"><div class="editorial-section-head"><div><h2>Your study pulse</h2><p>Progress without the visual noise.</p></div>${btn('Open analytics',"go('analytics')")}</div>
 <div class="dashboard-grid-wide">
   <div class="editorial-card"><h3>Question bank</h3><div class="caption">Completed across all tracked sets</div><div class="editorial-value">${qDone} / ${qTotal}</div><div class="thin-progress"><span style="width:${pct(qDone,qTotal)}%"></span></div><div class="editorial-foot">${pct(qDone,qTotal)}% complete</div></div>
   <div class="editorial-card"><h3>Current goal</h3><div class="caption">${goal?esc(goal.category||'Goal'):'No active goal'}</div><div class="editorial-value">${goal?Math.round(+goal.progress||0)+'%':'—'}</div>${goal?`<div class="thin-progress"><span style="width:${Math.min(100,+goal.progress||0)}%"></span></div><div class="editorial-foot">${esc(goal.name)}</div>`:`<div class="editorial-foot">Create one to connect daily work to the bigger picture.</div>`}</div>
   <div class="editorial-card"><h3>Last session</h3><div class="caption">Most recently logged</div><div class="editorial-value">${lastSession?lastSession.duration+'m':'—'}</div><div class="editorial-foot">${lastSession?esc(lastSession.subject)+' · '+fmtDate(lastSession.date):'No study session yet'}</div></div>
 </div></div>`;

 content+=`<div class="editorial-section"><div class="editorial-section-head"><div><h2>Coming up</h2><p>Deadlines stay visible so nothing sneaks up on you.</p></div></div>
 <div class="editorial-card">
   ${upcoming.length?upcoming.map(e=>{let d=daysBetween(today(),e.date);return `<div class="upcoming-row"><div><b>${esc(e.name)}</b><div class="meta">${esc(e.subject||'')} · ${fmtDate(e.date)}</div></div><div class="date-block"><b>${d===0?'Today':d+' days'}</b><span>remaining</span></div></div>`}).join(''):`<div class="empty">No upcoming exams. Add one from the Exams page.</div>`}
   ${due.length?`<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)"><div class="eyebrow" style="color:var(--pink);margin-bottom:7px">Revision due</div>${due.map(r=>`<div class="upcoming-row"><div><b>${esc(r.topic)}</b><div class="meta">${esc(r.subject||'')} · due ${fmtDate(r.nextDate)}</div></div><span class="badge high">Due</span></div>`).join('')}</div>`:''}
 </div></div>`;

 content+=`<div class="editorial-section"><div class="editorial-section-head"><div><h2>Last 7 days</h2><p>Your consistency at a glance.</p></div></div><div class="editorial-card">${studyBars(7)}</div></div>`;
 content+=`</div>`;
 return content;
}

function rank(t){return t.priority==='High'?3:t.priority==='Medium'?2:1}
function taskHTML(t){return `<div class="task ${t.done?'done':''}">
 <button class="check" onclick="toggleTask('${t.id}')">${t.done?'✓':''}</button>
 <div><div class="task-name">${esc(t.name)}</div><div class="meta">${esc(t.subject||'General')} · ${t.minutes||0} min ${t.deadline?'· '+esc(t.deadline):''}</div></div>
 <div class="item-actions"><span class="badge ${t.priority?.toLowerCase()||''}">${esc(t.priority||'Low')}</span><button class="small-btn" onclick="editTask('${t.id}')">✎</button><button class="small-btn" onclick="del('tasks','${t.id}')">×</button></div>
 </div>`}
function focusHTML(){
 let arr=[];
 data.tasks.filter(t=>t.date===today()&&!t.done).sort((a,b)=>rank(b)-rank(a)).slice(0,3).forEach(t=>arr.push(`<div class="goal"><div class="row"><b>${esc(t.name)}</b><span class="badge">${esc(t.subject||'General')}</span></div><div class="meta">${t.minutes||0} min · ${esc(t.priority||'Low')} priority</div></div>`));
 if(!arr.length)arr.push(`<div class="empty">Your top priorities will appear here once you schedule today's tasks.</div>`);
 return arr;
}
function examMini(e){let d=daysBetween(today(),e.date);return `<div class="exam"><div class="row"><b>${esc(e.name)}</b><span class="badge">${d===0?'Today':d+' days'}</span></div><div class="meta">${esc(e.subject||'')} · ${fmtDate(e.date)}</div></div>`}
function revMini(r){return `<div class="goal"><div class="row"><b>${esc(r.topic)}</b><span class="badge high">Due</span></div><div class="meta">Next revision: ${fmtDate(r.nextDate)}</div></div>`}
function goalMini(g){return `<div class="goal"><div class="row"><b>${esc(g.name)}</b><span class="badge">${g.progress||0}%</span></div><div class="progress" style="margin:8px 0"><span style="width:${Math.min(100,g.progress||0)}%"></span></div><div class="meta">${esc(g.deadline?fmtDate(g.deadline):g.status||'In progress')}</div></div>`}
function studyBars(n){
 let vals=[];for(let i=n-1;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let ds=d.toISOString().slice(0,10);vals.push({d,mins:dateStudy(ds)})}
 let max=Math.max(60,...vals.map(x=>x.mins));
 return `<div class="chart">${vals.map(x=>`<div class="bar-wrap"><div class="bar" style="height:${Math.max(2,(x.mins/max)*170)}px" title="${x.mins} min"></div><div class="bar-label">${x.d.toLocaleDateString('en-IN',{weekday:'short'}).slice(0,2)}</div></div>`).join('')}</div>`;
}
function subjectProgress(){
 if(!data.subjects.length)return `<div class="empty">Add subjects to see progress.</div>`;
 return `<div class="stat-list">${data.subjects.slice(0,7).map(s=>{let ts=data.topics.filter(t=>t.subject===s.name);let p=ts.length?Math.round(ts.reduce((a,t)=>a+(+t.progress||0),0)/ts.length):0;return `<div><div class="row"><span>${esc(s.name)}</span><b>${p}%</b></div><div class="progress" style="margin-top:6px"><span style="width:${p}%"></span></div></div>`}).join('')}</div>`;
}

function todayPage(){
 let tasks=data.tasks.filter(t=>t.date===today());
 return shell('Today','One screen for the day: priorities, schedule, and actual study.',btn('+ Task',"openTask()",true)+btn('+ Session',"openSession()"))+
 `<div class="grid cols-2"><div class="card"><div class="section-title"><h2>Tasks</h2></div><div class="list">${tasks.length?tasks.sort((a,b)=>rank(b)-rank(a)).map(taskHTML).join(''):`<div class="empty">No tasks yet.</div>`}</div></div>
 <div class="card"><div class="section-title"><h2>Today’s study</h2></div>${todayStudyTable()}</div></div>`;
}
function todayStudyTable(){let s=data.sessions.filter(x=>x.date===today());if(!s.length)return `<div class="empty">No study sessions logged.</div>`;return `<table><thead><tr><th>Subject</th><th>Topic</th><th>Duration</th></tr></thead><tbody>${s.map(x=>`<tr><td>${esc(x.subject)}</td><td>${esc(x.topic||'')}</td><td>${x.duration} min</td></tr>`).join('')}</tbody></table>`}

function studyPage(){
 return shell('Study','Manage subjects, chapters, sessions, and your study timer.',btn('+ Subject',"openSubject()",true)+btn('+ Topic',"openTopic()"))+
 `<div class="grid cols-2"><div class="card"><div class="section-title"><h2>Subjects</h2><span class="meta">Same subjects used in Topics</span></div>${subjectsTable()}</div>
 <div class="card"><div class="section-title"><h2>Study timer</h2>${btn('⛶ Expand',"expandTimer()")}</div><div class="timer"><div id="clock" class="clock">25:00</div><div class="meta">Choose a subject first. The topic list will show only topics belonging to that subject.</div><div class="form-inline"><select id="timerSubject" onchange="syncStudyTopicSelect()"><option value="">Subject</option>${data.subjects.map(s=>`<option value="${esc(s.name)}">${esc(s.name)}</option>`).join('')}</select><select id="timerTopic"><option value="">Topic</option></select><input id="timerMins" type="number" min="1" value="25" style="width:85px"></div><div class="timer-controls">${btn('Start',"startTimer()",true)}${btn('Pause',"pauseTimer()")}${btn('Reset',"resetTimer()")}</div></div></div></div>
 <div class="card" style="margin-top:16px"><div class="section-title"><h2>Recent study sessions</h2>${btn('+ Session',"openSession()")}</div>${sessionTable()}</div>`;
}
function syncStudyTopicSelect(){
 let ss=document.getElementById('timerSubject'),st=document.getElementById('timerTopic');if(!ss||!st)return;
 let subject=ss.value, current=st.value;
 let topics=data.topics.filter(t=>!subject||t.subject===subject);
 st.innerHTML='<option value="">Topic</option>'+topics.map(t=>`<option value="${esc(t.name)}">${esc(t.name)}</option>`).join('');
 if(topics.some(t=>t.name===current)) st.value=current;
 syncFocusFields();
}
function topicsPage(){
 if(!data.topics.length)return shell('Topics','Track every chapter separately — progress, questions, study time, and revision.',btn('Import syllabus',"openSyllabusImport()",true)+btn('+ Topic',"openTopic()"))+`<div class="card"><div class="empty">No topics yet. Add your chapters to start tracking them separately.</div></div>`;
 let groups=[...new Set(data.topics.map(t=>t.subject||'General'))];
 return shell('Topics','Organised subject-wise so the page stays compact and easy to use.',btn('Import syllabus',"openSyllabusImport()",true)+btn('+ Topic',"openTopic()"))+
 `<div class="topic-directory">${groups.map((sub,idx)=>{
   let ts=data.topics.filter(t=>(t.subject||'General')===sub);
   let avg=Math.round(ts.reduce((a,t)=>a+(+t.progress||0),0)/ts.length);
   let complete=ts.filter(t=>(+t.progress||0)>=100).length;
   return `<details class="subject-dropdown" ${idx===0?'open':''}>
     <summary>
       <div class="subject-drop-left"><span class="chevron">›</span><div><b>${esc(sub)}</b><div class="section-caption">${complete}/${ts.length} topics complete</div></div></div>

async function loadScript(src){return new Promise((res,rej)=>{let x=document.createElement('script');x.src=src;x.onload=res;x.onerror=rej;document.head.appendChild(x)})}
function cleanTopicName(x){return String(x||'').replace(/^[-•–—:\s]+/,'').replace(/\s+/g,' ').trim()}
function parseSyllabusText(text){
 let lines=text.split(/\r?\n/).map(cleanTopicName).filter(Boolean);
 let subjects=['ENGLISH','ACCOUNTANCY','BUSINESS STUDIES','ECONOMICS','MATHEMATICS'];
 let out={};subjects.forEach(x=>out[x]=[]);
 let current=null;
 let subjectRe=/^(ENGLISH|ACCOUNTANCY|BUSINESS STUDIES|ECONOMICS|MATHEMATICS)$/i;
 let bookRe=/^BOOK\s+[IVX]+$/i;
 let skip=/^(SUMMATIVE ASSESSMENT|CLASS:|DATESHEET|DAY & DATE|SUBJECTS|TIME)$/i;

 // These are the 13 Maths chapters from the uploaded syllabus. We match by title as
 // well as chapter number because PDF text extraction can place Ch-1 to Ch-3 before
 // the MATHEMATICS heading, where Economics also has Ch-1/2/3.
 const mathNames=[
  'Relations and Functions','Inverse Trigonometric Functions','Matrices','Determinants',
  'Continuity and Differentiability','Application of Derivatives','Integrals',
  'Application of Integrals','Differential Equations','Vector Algebra',
  'Three Dimensional Geometry','Linear Programming','Probability'
 ];
 let mathTopics=[];
 for(let i=1;i<=13;i++){
   let title=mathNames[i-1];
   let hit=lines.find(x=>new RegExp('^Ch\\s*-?\\s*'+i+'\\s*[-:]?\\s*'+title.replace(/[.*+?^${}()|[\\]\\]/g,'\\$&')+'\\s*$','i').test(x));
   if(!hit) hit=lines.find(x=>new RegExp('^Ch\\s*-?\\s*'+i+'\\s*[-:]?\\s*.*'+title.replace(/[.*+?^${}()|[\\]\\]/g,'\\$&')+'.*$','i').test(x));
   if(hit) mathTopics.push('Ch-'+i+' '+title);
 }

 for(let line of lines){
   let up=line.toUpperCase();
   if(subjectRe.test(line)){current=up;continue}
   if(skip.test(line)||bookRe.test(line))continue;
   if(!current)continue;

   // Economics units are useful as separate high-level topics.
   if(current==='ECONOMICS' && /^Unit\s+\d+/i.test(line)){out[current].push(line);continue}

   // English has skill headings and chapter/literature lines rather than uniform "Chapter" labels.
   if(current==='ENGLISH'){
     if(/^(Reading Skills|Creative Writing Skills|Literature|Poetry|Vistas):/i.test(line)){
       let m=line.match(/^(Reading Skills|Creative Writing Skills|Literature|Poetry|Vistas):\s*(.*)$/i);
       let head=m?m[1]:line.replace(/:.*/,''),rest=m?m[2]:'';
       if(rest){
         rest.split(/\s*,\s*/).map(cleanTopicName).filter(Boolean).forEach(v=>out[current].push(head+' — '+v));
       }else out[current].push(head);
       continue;
     }
     if(/^(Notice Writing|Invitation Writing|Letter to the Editor|Job Application|Article Writing|Report Writing)/i.test(line)){out[current].push(line);continue}
     if(/^(The Last Lesson|Lost Spring|Deep Water|The Rattrap|Indigo|Poets and Pancakes|The Interview|Going Places|My Mother at Sixty-Six|Keeping Quiet|A Thing of Beauty|A Roadside Stand|Aunt Jennifer's Tigers|The Third Level|The Tiger King|Journey to the End of the Earth|The Enemy|On the Face of It|Memories of Childhood)/i.test(line)){out[current].push(line);continue}
   }else if(/^(Chapter|Ch)\s*[-\s]?\d+\s*[-:]?/i.test(line)){
     // Do not capture Maths chapters under another subject; Maths is rebuilt below.
     if(current!=='MATHEMATICS' && /^Ch\s*[-\s]?\d+\b/i.test(line)) continue;
     out[current].push(line);
   }
 }

 if(mathTopics.length) out.MATHEMATICS=mathTopics;
 // Remove any Ch-1...Ch-13 rows accidentally caught under other subjects.
 Object.keys(out).forEach(k=>{
   if(k!=='MATHEMATICS') out[k]=out[k].filter(x=>!/^Ch\s*[-\s]?\d+\b/i.test(x));
   out[k]=[...new Set(out[k])];
 });
 return out;
}
async function processSyllabusFile(){
 let f=document.getElementById('syllabusFile')?.files?.[0];
 if(!f){alert('Please choose a syllabus file first.');return}
 let status=document.getElementById('importStatus');status.textContent='Reading syllabus…';
 try{
   let text='';
   if(/\.pdf$/i.test(f.name)){
     if(!window.pdfjsLib) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
     if(!window.pdfjsLib) throw new Error('PDF reader could not load');
     pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
     let pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
     for(let i=1;i<=pdf.numPages;i++){let pg=await pdf.getPage(i),c=await pg.getTextContent();text+=c.items.map(x=>x.str).join('\n')+'\n'}
   }else if(/\.(xlsx|xls|csv)$/i.test(f.name)){
     if(!window.XLSX) await loadScript('https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js');
     let wb=XLSX.read(await f.arrayBuffer(),{type:'array'});text=wb.SheetNames.map(n=>XLSX.utils.sheet_to_txt(wb.Sheets[n])).join('\n');
   }else text=await f.text();
   let parsed=parseSyllabusText(text);window._syllabusPreview=parsed;
   let total=Object.values(parsed).reduce((a,v)=>a+v.length,0);
   document.getElementById('importPreview').innerHTML='<b>'+total+' topics detected</b><div class="import-preview">'+Object.entries(parsed).filter(([k,v])=>v.length).map(([k,v])=>'<div><b>'+esc(k)+'</b><span>'+v.length+' topics</span></div>').join('')+'</div>';
   status.textContent='Preview ready. Click the button again to import.';
   modalSubmit=()=>confirmSyllabusImport();
 }catch(e){console.error(e);status.textContent='Could not read this file. Try PDF, XLSX or CSV.'}
}
function confirmSyllabusImport(){
 let parsed=window._syllabusPreview;if(!parsed)return processSyllabusFile();
 let added=0;
 for(let [subject,topics] of Object.entries(parsed)){
   if(!topics.length)continue;
   let existingSub=data.subjects.find(s=>s.name.toLowerCase()===subject.toLowerCase());
   if(!existingSub)data.subjects.push({id:uid(),name:subject});
   topics.forEach(name=>{
     let exists=data.topics.some(t=>(t.subject||'').toLowerCase()===subject.toLowerCase()&&t.name.toLowerCase()===name.toLowerCase());
     if(!exists){data.topics.push({id:uid(),name,subject,progress:0});added++}
   });
 }
 save();closeModal();alert(added+' new topics imported.');
}

function openQuestion(q={}){
 openModal(q.id?'Edit question set':'New question set',`<div class="form-grid">${fs('subject','Subject',q.subject||'',data.subjects.map(s=>s.name))}${f('chapter','Chapter',q.chapter||'')}${f('total','Total questions',q.total||0,'number','min="0"')}${f('completed','Completed',q.completed||0,'number','min="0"')}${f('incorrect','Incorrect',q.incorrect||0,'number','min="0"')}</div>`);
 modalSubmit=()=>{upsert('questions',{id:q.id||uid(),subject:v('subject'),chapter:v('chapter'),total:+v('total')||0,completed:+v('completed')||0,incorrect:+v('incorrect')||0});save();closeModal()};
}
function editQuestion(id){openQuestion(data.questions.find(x=>x.id===id))}
function openRevision(r={}){
 openModal(r.id?'Edit revision':'New revision item',`<div class="form-grid">${f('topic','Topic',r.topic||'')}${fs('subject','Subject',r.subject||'',data.subjects.map(s=>s.name))}${fs('stage','Stage',r.stage||'First',['First','Second','Third','Final'])}${f('lastDate','Last revised',r.lastDate||today(),'date')}${f('nextDate','Next due',r.nextDate||today(),'date')}</div>`);
 modalSubmit=()=>{upsert('revisions',{id:r.id||uid(),topic:v('topic'),subject:v('subject'),stage:v('stage'),lastDate:v('lastDate'),nextDate:v('nextDate')});save();closeModal()};
}
function editRevision(id){openRevision(data.revisions.find(x=>x.id===id))}
function openGoal(g={}){
 openModal(g.id?'Edit goal':'New goal',`<div class="form-grid">${f('name','Goal name',g.name||'')}${fs('category','Category',g.category||'Academic',['Academic','College','Personal','Health','Other'])}${f('deadline','Deadline',g.deadline||'','date')}${f('progress','Progress %',g.progress||0,'number','min="0" max="100"')}${fs('status','Status',g.status||'In Progress',['Not Started','In Progress','On Track','At Risk','Completed'])}<div class="field full"><label>Description / next milestone</label><textarea id="f_description">${esc(g.description||'')}</textarea></div></div>`);
 modalSubmit=()=>{upsert('goals',{id:g.id||uid(),name:v('name'),category:v('category'),deadline:v('deadline'),progress:+v('progress')||0,status:v('status'),description:v('description')});save();closeModal()};
}
function editGoal(id){openGoal(data.goals.find(x=>x.id===id))}
function openExam(e={}){
 openModal(e.id?'Edit exam':'New exam',`<div class="form-grid">${f('name','Exam name',e.name||'')}${fs('subject','Subject',e.subject||'',data.subjects.map(s=>s.name))}${f('date','Exam date',e.date||today(),'date')}${f('target','Target score',e.target||'')}${f('score','Actual score',e.score||'')}${f('syllabus','Syllabus summary',e.syllabus||'')}</div>`);
 modalSubmit=()=>{upsert('exams',{id:e.id||uid(),name:v('name'),subject:v('subject'),date:v('date'),target:v('target'),score:v('score'),syllabus:v('syllabus')});save();closeModal()};
}
function editExam(id){openExam(data.exams.find(x=>x.id===id))}
function upsert(arr,obj){let i=data[arr].findIndex(x=>x.id===obj.id);if(i>=0)data[arr][i]=obj;else data[arr].push(obj)}
function deleteSubjectFromTopics(subjectName){
 let hasTopics=data.topics.some(t=>(t.subject||'General')===subjectName);
 let msg=hasTopics?`Delete \"${subjectName}\" and all topics under it from the Topics section?`:`Delete subject \"${subjectName}\"?`;
 if(!confirm(msg))return;
 data.subjects=data.subjects.filter(s=>s.name!==subjectName);
 data.topics=data.topics.filter(t=>(t.subject||'General')!==subjectName);
 save();
}
function del(arr,id){if(confirm('Delete this item?')){data[arr]=data[arr].filter(x=>x.id!==id);save()}}
function v(n){let e=document.getElementById('f_'+n);return e?e.value:''}

let timer={running:false,seconds:25*60,interval:null,startedAt:null,plannedMins:25};
function timerValue(id,fallback=''){return document.getElementById(id)?.value||fallback}
function setTimerDisplay(){let text=`${String(Math.floor(timer.seconds/60)).padStart(2,'0')}:${String(timer.seconds%60).padStart(2,'0')}`;let a=document.getElementById('clock'),b=document.getElementById('focusClock');if(a)a.textContent=text;if(b)b.textContent=text}
function syncFocusFields(){
 let ss=document.getElementById('focusSubject'),st=document.getElementById('focusTopic');if(!ss)return;
 ss.innerHTML='<option value="">Subject</option>'+data.subjects.map(s=>`<option value="${esc(s.name)}">${esc(s.name)}</option>`).join('');
 let ts=document.getElementById('timerSubject')?.value||''; ss.value=ts;
 st.innerHTML='<option value="">Topic</option>'+data.topics.filter(t=>!ts||t.subject===ts).map(t=>`<option value="${esc(t.name)}">${esc(t.name)}</option>`).join('');
 let tt=document.getElementById('timerTopic')?.value||'';st.value=tt;
 let tm=document.getElementById('timerMins')?.value||25;document.getElementById('focusMins').value=tm;
 updateFocusLabel();renderFocusTasks()
}
function updateFocusLabel(){let s=timerValue('focusSubject',timerValue('timerSubject','')),t=timerValue('focusTopic',timerValue('timerTopic',''));let el=document.getElementById('focusLabel');if(el)el.textContent=[s,t].filter(Boolean).join(' · ')||'Choose a subject and topic'}
function renderFocusTasks(){let el=document.getElementById('focusTasks');if(!el)return;let tasks=data.tasks.filter(t=>t.date===today()).sort((a,b)=>rank(b)-rank(a));el.innerHTML=tasks.length?tasks.map(t=>`<div class="focus-task ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}');renderFocusTasks()"><div><div class="focus-task-name">${esc(t.name)}</div><div class="focus-task-meta">${esc(t.subject||'General')}${t.minutes?' · '+t.minutes+' min':''}${t.deadline?' · '+esc(t.deadline):''}</div></div><span class="badge">${esc(t.priority||'Medium')}</span></div>`).join(''):'<div class="empty">No tasks planned for today. Add tasks here and use this column as your checklist.</div>'}
function expandTimer(){let ov=document.getElementById('focusOverlay');if(!ov)return;ov.classList.add('show');syncFocusFields();setTimerDisplay()}
function collapseTimer(){document.getElementById('focusOverlay')?.classList.remove('show');syncTimerUI()}
function syncTimerUI(){setTimerDisplay()}
function startTimer(){if(!timer.running){let mins=+(timerValue('focusMins',timerValue('timerMins','25'))||25);timer.plannedMins=mins;if(timer.seconds<=0||timer.seconds>mins*60)timer.seconds=mins*60;timer.running=true;timer.startedAt=Date.now();clearInterval(timer.interval);timer.interval=setInterval(()=>{timer.seconds--;setTimerDisplay();if(timer.seconds<=0){clearInterval(timer.interval);timer.running=false;let subject=timerValue('focusSubject',timerValue('timerSubject','General'))||'General';let topic=timerValue('focusTopic',timerValue('timerTopic',''));data.sessions.push({id:uid(),date:today(),subject,topic,duration:mins,type:'Learning'});save();alert('Timer complete — study session saved.');timer.seconds=mins*60;setTimerDisplay()}},1000)}}
function pauseTimer(){timer.running=false;clearInterval(timer.interval)}
function resetTimer(){pauseTimer();timer.seconds=(+(timerValue('focusMins',timerValue('timerMins','25'))||25))*60;setTimerDisplay()}
document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});
document.addEventListener('change',e=>{
 if(e.target.id==='focusSubject'){
   let st=document.getElementById('focusTopic'),sub=e.target.value;
   st.innerHTML='<option value="">Topic</option>'+data.topics.filter(t=>!sub||t.subject===sub).map(t=>`<option value="${esc(t.name)}">${esc(t.name)}</option>`).join('');
 }
 if(['focusSubject','focusTopic','focusMins'].includes(e.target.id)){updateFocusLabel();if(e.target.id==='focusMins'&&!timer.running)resetTimer();}
});
window.addEventListener('beforeunload',()=>{if(timer.running){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}});

renderAll();
</script>
</body>
